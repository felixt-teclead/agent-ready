# Documentation guards on every pull request.
#
# The guards are a published npm package, not part of the repo's test suite, so
# a Python or Go repo gets them without adopting a JS test runner. It still needs
# Node on the runner — that is the cost of this choice.
name: Doc guards

on:
  pull_request:
  workflow_dispatch:

# Actions minutes are metered on a private repo. Cancel a superseded run rather
# than paying for both.
concurrency:
  group: doc-guards-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doc-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Exit 1 is a violation. Exit 2 means the guard could not run — a vacuity
      # floor was missed or the config is invalid — and it fails the job too,
      # because "found nothing to check" must never read as "everything is fine".
      - name: Run doc guards
        run: npx --yes doc-guards@^0 check --format github
